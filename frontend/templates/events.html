<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Events — EventFlow</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a href="/" class="nav-logo">⚡ Event<span>Flow</span></a>
    <div class="nav-links"><a href="/">Discover</a><a href="/events" class="active">Browse All</a><a href="/create-event">Create Event</a></div>
    <div class="nav-right" id="nav-right"></div>
  </div>
</nav>

<div style="padding:40px 0 80px">
  <div class="container">
    <div style="margin-bottom:32px">
      <h1 style="font-family:var(--font-display);font-size:36px;font-weight:800">Browse Events</h1>
      <p style="color:var(--text-2);margin-top:8px">Discover amazing events happening around you</p>
    </div>

    <!-- Filters -->
    <div class="filters" style="margin-bottom:32px">
      <input type="text" class="filter-input" id="search" placeholder="🔍  Search by name, city..." style="flex:2;min-width:220px">
      <select class="filter-select" id="category">
        <option value="">All Categories</option>
        <option value="conference">🎤 Conference</option>
        <option value="workshop">🛠️ Workshop</option>
        <option value="concert">🎵 Concert</option>
        <option value="meetup">☕ Meetup</option>
        <option value="webinar">💻 Webinar</option>
        <option value="sports">⚽ Sports</option>
        <option value="arts">🎨 Arts</option>
        <option value="networking">🤝 Networking</option>
      </select>
      <select class="filter-select" id="format">
        <option value="">All Formats</option>
        <option value="online">🌐 Online</option>
        <option value="inperson">📍 In-Person</option>
      </select>
      <select class="filter-select" id="price">
        <option value="">Any Price</option>
        <option value="free">🆓 Free</option>
        <option value="paid">💳 Paid</option>
      </select>
      <select class="filter-select" id="sort">
        <option value="upcoming">Upcoming First</option>
        <option value="featured">Featured First</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear</button>
    </div>

    <!-- Results header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="color:var(--text-2);font-size:14px" id="results-count">Loading...</div>
      <div style="display:flex;gap:8px">
        <button onclick="setView('grid')" id="view-grid" class="btn btn-secondary btn-sm">⊞ Grid</button>
        <button onclick="setView('list')" id="view-list" class="btn btn-ghost btn-sm">☰ List</button>
      </div>
    </div>

    <div id="events-container"><div class="page-loader"><div class="spinner"></div></div></div>

    <!-- Pagination -->
    <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:40px"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
let currentPage = 1;
let totalPages = 1;
let viewMode = 'grid';

function getFilters() {
  const f = { page: currentPage, per_page: 12 };
  const s = document.getElementById('search').value.trim();
  if (s) f.search = s;
  const cat = document.getElementById('category').value;
  if (cat) f.category = cat;
  const fmt = document.getElementById('format').value;
  if (fmt === 'online') f.is_online = true;
  else if (fmt === 'inperson') f.is_online = false;
  const price = document.getElementById('price').value;
  if (price === 'free') f.is_free = true;
  else if (price === 'paid') f.is_free = false;
  if (document.getElementById('sort').value === 'featured') f.featured = true;
  return f;
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('category').value = '';
  document.getElementById('format').value = '';
  document.getElementById('price').value = '';
  document.getElementById('sort').value = 'upcoming';
  currentPage = 1;
  loadEvents();
}

function setView(mode) {
  viewMode = mode;
  document.getElementById('view-grid').className = mode === 'grid' ? 'btn btn-secondary btn-sm' : 'btn btn-ghost btn-sm';
  document.getElementById('view-list').className = mode === 'list' ? 'btn btn-secondary btn-sm' : 'btn btn-ghost btn-sm';
  loadEvents();
}

async function loadEvents() {
  document.getElementById('events-container').innerHTML = '<div class="page-loader"><div class="spinner"></div></div>';
  const params = new URLSearchParams(getFilters());
  try {
    const data = await API.get(`/events?${params}`);
    totalPages = data.pages;
    document.getElementById('results-count').textContent = `${data.total} event${data.total !== 1 ? 's' : ''} found`;

    if (data.items.length === 0) {
      document.getElementById('events-container').innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <h3>No events found</h3>
          <p>Try adjusting your filters or check back later</p>
          <button class="btn btn-primary" onclick="clearFilters()" style="margin-top:16px">Clear Filters</button>
        </div>`;
    } else if (viewMode === 'grid') {
      document.getElementById('events-container').innerHTML = `<div class="events-grid">${data.items.map(e => Utils.eventCardHTML(e)).join('')}</div>`;
    } else {
      document.getElementById('events-container').innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${data.items.map(e => listRowHTML(e)).join('')}</div>`;
    }

    renderPagination();
  } catch(err) {
    document.getElementById('events-container').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error loading events</h3><p>${err.message}</p></div>`;
  }
}

function listRowHTML(e) {
  const price = e.min_price > 0 ? `$${e.min_price.toFixed(2)}` : 'FREE';
  const priceClass = e.min_price > 0 ? 'paid' : 'free';
  const loc = e.is_online ? 'Online' : [e.venue_city, e.venue_country].filter(Boolean).join(', ') || 'TBA';
  return `
    <a href="/event/${e.id}" class="card" style="display:flex;gap:20px;align-items:center;padding:18px;text-decoration:none">
      <div style="width:80px;height:80px;border-radius:var(--radius-sm);background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;overflow:hidden">
        ${e.cover_image_url ? `<img src="${e.cover_image_url}" style="width:100%;height:100%;object-fit:cover">` : Utils.categoryEmoji(e.category)}
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap">
          <span class="badge badge-category">${e.category}</span>
          ${e.is_online ? '<span class="badge badge-online">Online</span>' : ''}
          ${e.is_featured ? '<span class="badge badge-featured">Featured</span>' : ''}
        </div>
        <div style="font-weight:700;font-size:16px;color:var(--text-1)">${e.title}</div>
        <div style="font-size:13px;color:var(--text-2);margin-top:4px">${Utils.formatDateTime(e.start_datetime)} · ${loc}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="event-price ${priceClass}" style="font-size:18px;font-weight:800">${price}</div>
        <div style="font-size:12px;color:var(--text-3);margin-top:4px">👥 ${e.total_registrations}</div>
      </div>
    </a>`;
}

function renderPagination() {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  if (currentPage > 1) html += `<button class="btn btn-secondary btn-sm" onclick="goPage(${currentPage-1})">← Prev</button>`;
  for (let i = Math.max(1, currentPage-2); i <= Math.min(totalPages, currentPage+2); i++) {
    html += `<button class="btn ${i===currentPage?'btn-primary':'btn-ghost'} btn-sm" onclick="goPage(${i})">${i}</button>`;
  }
  if (currentPage < totalPages) html += `<button class="btn btn-secondary btn-sm" onclick="goPage(${currentPage+1})">Next →</button>`;
  el.innerHTML = html;
}

function goPage(p) { currentPage = p; loadEvents(); window.scrollTo(0,0); }

// Event listeners
const debSearch = Utils.debounce(() => { currentPage = 1; loadEvents(); }, 400);
document.getElementById('search').addEventListener('input', debSearch);
['category','format','price','sort'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { currentPage = 1; loadEvents(); });
});

// Parse URL params
const urlP = new URLSearchParams(window.location.search);
if (urlP.get('category')) document.getElementById('category').value = urlP.get('category');
if (urlP.get('featured')) document.getElementById('sort').value = 'featured';

document.addEventListener('DOMContentLoaded', loadEvents);
</script>
</body>
</html>
