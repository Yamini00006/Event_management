<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — EventFlow</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="auth-page">
  <div style="width:100%;max-width:480px">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/" class="nav-logo" style="justify-content:center;font-size:26px">⚡ Event<span>Flow</span></a>
      </div>
      <div class="auth-title" style="text-align:center">Create your account</div>
      <div class="auth-sub" style="text-align:center;margin-bottom:28px">Join the EventFlow community today</div>
      
      <div id="error-msg" style="display:none;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);color:var(--red);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;margin-bottom:16px"></div>
      
      <form id="register-form" style="display:flex;flex-direction:column;gap:16px">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" id="full_name" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="username" placeholder="johndoe" required minlength="3">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">I want to</label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <label id="role-attendee" style="background:var(--bg-elevated);border:2px solid var(--accent);border-radius:var(--radius-sm);padding:14px;cursor:pointer;text-align:center;transition:var(--transition)">
              <input type="radio" name="role" value="attendee" checked style="display:none">
              <div style="font-size:24px;margin-bottom:6px">🎟️</div>
              <div style="font-size:13px;font-weight:600">Attend Events</div>
              <div style="font-size:11px;color:var(--text-3);margin-top:2px">Browse & register</div>
            </label>
            <label id="role-organizer" style="background:var(--bg-elevated);border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;text-align:center;transition:var(--transition)">
              <input type="radio" name="role" value="organizer" style="display:none">
              <div style="font-size:24px;margin-bottom:6px">🎤</div>
              <div style="font-size:13px;font-weight:600">Host Events</div>
              <div style="font-size:11px;color:var(--text-3);margin-top:2px">Create & manage</div>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;margin-top:4px" id="submit-btn">
          Create Account
        </button>
      </form>
      
      <div class="auth-switch">Already have an account? <a href="/login">Sign in</a></div>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
if (Auth.isLoggedIn()) window.location.href = '/dashboard';

// Role selector styling
document.querySelectorAll('input[name="role"]').forEach(radio => {
  radio.addEventListener('change', () => {
    document.getElementById('role-attendee').style.borderColor = radio.value === 'attendee' ? 'var(--accent)' : 'var(--border)';
    document.getElementById('role-organizer').style.borderColor = radio.value === 'organizer' ? 'var(--accent)' : 'var(--border)';
  });
});
document.getElementById('role-organizer').addEventListener('click', () => {
  document.querySelector('[value="organizer"]').checked = true;
  document.getElementById('role-attendee').style.borderColor = 'var(--border)';
  document.getElementById('role-organizer').style.borderColor = 'var(--accent)';
});
document.getElementById('role-attendee').addEventListener('click', () => {
  document.querySelector('[value="attendee"]').checked = true;
  document.getElementById('role-attendee').style.borderColor = 'var(--accent)';
  document.getElementById('role-organizer').style.borderColor = 'var(--border)';
});

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  errEl.style.display = 'none';
  
  const role = document.querySelector('input[name="role"]:checked').value;
  
  try {
    const user = await Auth.register({
      full_name: document.getElementById('full_name').value,
      username: document.getElementById('username').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      role,
    });
    Toast.success('Account created successfully!');
    setTimeout(() => { window.location.href = '/dashboard'; }, 800);
  } catch(err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
